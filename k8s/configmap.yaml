apiVersion: v1
kind: ConfigMap
metadata:
  name: nhwz-config
  namespace: nhwz
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DJANGO_ALLOWED_HOSTS: "nhwz.example.com"
  DJANGO_ENV: "production"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "false"
  LOG_LEVEL: "INFO"
  APP_VERSION: "8.0.0"
  OTP_LENGTH: "6"
  OTP_TTL_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "5"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
