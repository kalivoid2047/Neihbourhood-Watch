apiVersion: v1
kind: Secret
metadata:
  name: nhwz-secrets
  namespace: nhwz
type: Opaque
stringData:
  # Replace all values with real secrets before deploying.
  DJANGO_SECRET_KEY: "CHANGE_ME_strong_random_secret_key"
  DATABASE_URL: "postgresql://nhwz:CHANGE_ME@postgres:5432/nhwz"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT_URL: "http://minio:9000"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  MINIO_BUCKET_NAME: "nhwz-media"
  EMAIL_HOST: "smtp.example.com"
  EMAIL_HOST_USER: "noreply@example.com"
  EMAIL_HOST_PASSWORD: "CHANGE_ME"
  DEFAULT_FROM_EMAIL: "noreply@nhwz.example.com"
  SENTRY_DSN: ""
  CORS_ALLOWED_ORIGINS: "https://nhwz.example.com"
  DJANGO_ALLOWED_HOSTS: "nhwz.example.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://nhwz.example.com"
