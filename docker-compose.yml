services:
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate --settings=config.settings.production
      && python manage.py collectstatic --noinput --settings=config.settings.production
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: nhwz
      POSTGRES_USER: nhwz
      POSTGRES_PASSWORD: nhwz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhwz -d nhwz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nhwz
      MINIO_ROOT_PASSWORD: nhwz-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "config.celery", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    command: celery -A config.celery beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      # Override these in .env to change where nginx routes traffic.
      # Docker defaults match the service names and volume mount paths defined below.
      NHWZ_API_HOST: ${NHWZ_API_HOST:-api:8000}
      NHWZ_STATIC_PATH: ${NHWZ_STATIC_PATH:-/staticfiles/}
      NHWZ_MEDIA_PATH: ${NHWZ_MEDIA_PATH:-/media/}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - staticfiles:/staticfiles:ro
      - media:/media:ro
    # The official nginx image auto-runs envsubst on /etc/nginx/templates/*.template
    # and writes the result to /etc/nginx/conf.d/. Only the three NHWZ_* variables
    # are substituted; nginx's own $host/$remote_addr etc. are left untouched.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  staticfiles:
  media:
