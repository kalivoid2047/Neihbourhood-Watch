org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Network timeouts ──────────────────────────────────────────────────────────
# Gradle's defaults (30s connect, 30s read) assume a fast connection and give up
# part-way through the larger Android Gradle Plugin and Firebase jars on slower
# links. The failure is misleading: the download times out, and Gradle then
# reports a cascade of "plugin requires one of the Android Gradle plugins"
# errors that look like a configuration problem rather than a network one.
#
# Three minutes each. This only affects how long Gradle waits, never the build
# output, so it is safe to leave in place.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Resume large downloads rather than restarting them after a stall.
systemProp.http.keepAlive=true
