# This file is superseded by default.conf.template — do not edit directly.
# Docker compose and the generate-nginx-conf scripts render the template into a
# concrete conf using NHWZ_API_HOST / NHWZ_STATIC_PATH / NHWZ_MEDIA_PATH from .env.
# The values below are the Docker compose defaults kept here for reference only.

upstream nhwz_api {
    server api:8000;
}

# Enable gzip compression for text-based responses.
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    # Set 10 MB above the 100 MB Django-level limit so Nginx never rejects a
    # request that Django would otherwise accept.
    client_max_body_size 110m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Static files ──────────────────────────────────────────────────────────
    location /static/ {
        alias /staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Protected media (JWT-gated via X-Accel-Redirect) ─────────────────────
    # Direct access is blocked; Django sets X-Accel-Redirect for nginx to serve.
    location /protected-media/ {
        internal;
        alias /media/;
    }

    # ── WebSocket upgrade ─────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://nhwz_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API and all other requests ────────────────────────────────────────────
    location / {
        proxy_pass http://nhwz_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
